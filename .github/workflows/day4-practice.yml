name: DAY4 Practice
on:
  pull_request:
    branches: [main]
    paths:
      - 'hht/docs/workbook/day-04.md'
      - 'hht/lessons/04/**'
      - 'hht/submissions/*.md'
      - 'hht/scripts/check_day4_practice.py'
      - 'hht/scripts/capture_day4_vscode.py'
      - '.github/workflows/day4-practice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearse:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Extract, edit, compare, package, reopen and browse
        run: python hht/scripts/check_day4_practice.py --browser --output test-results/day4
      - name: Install official portable VS Code for real diff capture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://update.code.visualstudio.com/1.105.1/win32-x64-archive/stable -OutFile "$env:RUNNER_TEMP/vscode.zip"
          Expand-Archive "$env:RUNNER_TEMP/vscode.zip" "$env:RUNNER_TEMP/day4-vscode"
      - name: Open actual VS Code diff and capture its renderer
        if: runner.os == 'Windows'
        run: python hht/scripts/capture_day4_vscode.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: day4-practice-${{ runner.os }}
          path: test-results/day4
          if-no-files-found: error
