name: PHP CLI Exercise

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  official-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Use native Linux Engine, pull patched CLI, and verify templates and UTF-8
        run: python hht/scripts/verify_php_cli.py --runtime docker
      - uses: actions/setup-node@v5
        with:
          node-version: "22.20.0"
      - run: npm ci
      - name: Validate generated HTML
        run: npx --no-install html-validate test-results/php-cli/index.html
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: php-cli-generated-html
          path: test-results/php-cli/index.html
