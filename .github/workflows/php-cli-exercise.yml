name: PHP CLI Exercise

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  adapter-contracts:
    name: Adapter contracts (simulated CLI, ${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test wslc safety gates, byte handling, student-copy isolation, and cleanup
        run: python -m unittest discover -s hht/scripts -p test_php_container_runtime.py -v

  official-cli:
    name: PHP integration (native Linux Docker, not a wslc hardware test)
    needs: adapter-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Verify pinned image, effective isolation, PHP version, templates, and UTF-8
        run: python hht/scripts/verify_php_cli.py --runtime docker
      - uses: actions/setup-node@v5
        with:
          node-version: "22.20.0"
      - run: npm ci
      - name: Validate generated HTML
        run: npx --no-install html-validate test-results/php-cli/index.html
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: php-cli-generated-html
          path: |
            test-results/php-cli/index.html
            test-results/php-cli/process-security.json
            test-results/php-cli/runtime-report.json
