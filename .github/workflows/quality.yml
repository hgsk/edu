name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22.20.0"

      - name: Install locked validation tools
        run: npm ci

      - name: Install Python validation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate course structure and local assets
        run: python hht/scripts/validate-course.py

      - name: Require current Unity WebGL samples and workbook listing
        run: python unity/scripts/build_course.py --check

      - name: Test Unity workbook and WebGL stale-build detection
        run: python -m unittest discover -s unity/scripts -p "test_*.py"

      - name: Test course consistency regression detection
        run: python -m unittest discover -s hht/scripts -p "test_*.py"

      - name: Check Azure setup script syntax
        run: bash -n hht/scripts/setup-azure-practice.sh

      - name: Test workbook DAY link validation
        run: python -m unittest discover -s hht/scripts -p "test_workbook_navigation.py"

      - name: Check JavaScript syntax
        run: |
          node --check hht/scripts/capture-workbook.cjs
          node --check hht/typing-app/app.js
          node --check hht/typing-app/extra-items.js
          node --check hht/typing-app/reader.js
          node --check hht/typing-app/account.js
          node --check hht/typing-app/firebase-config.js
          node --test hht/typing-app/progress-store.test.mjs
          node --test hht/typing-app/audio-catalog.test.mjs

      - name: Validate HTML
        run: >-
          npx --no-install html-validate
          "hht/hands-on/vscode-basics/site/index.html"
          "hht/typing-app/index.html"
          "hht/typing-app/reader.html"
          "hht/references/cafe-site/*.html"
          "hht/references/portfolio-template/index.html"
          "hht/hands-on/summer-festival-annual-update/starter/*.html"

      - name: Validate CSS
        run: >-
          npx --no-install stylelint
          hht/hands-on/vscode-basics/site/style.css
          hht/typing-app/style.css
          hht/typing-app/reader.css
          hht/typing-app/arcade.css
          hht/references/cafe-site/css/style.css
          hht/references/portfolio-template/css/style.css
          hht/hands-on/summer-festival-annual-update/starter/css/style.css
          --config hht/hands-on/vscode-basics/site/.stylelintrc.json

      - name: Check summer-festival links and fragments
        run: >-
          npx --no-install linkinator
          hht/hands-on/summer-festival-annual-update/starter
          --recurse
          --check-fragments
