name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"

      - name: Install Python validation dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate course structure and local assets
        run: python hht/scripts/validate-course.py

      - name: Check JavaScript syntax
        run: |
          node --check hht/typing-app/app.js
          node --check hht/typing-app/extra-items.js

      - name: Validate HTML
        run: >-
          npx --yes html-validate
          "hht/tour/index.html"
          "hht/typing-app/index.html"
          "hht/starter-site/*.html"
          "hht/portfolio/index.html"
          "hht/hands-on/summer-festival-annual-update/starter/*.html"

      - name: Validate CSS
        run: >-
          npx --yes stylelint
          hht/tour/style.css
          hht/typing-app/style.css
          hht/starter-site/css/style.css
          hht/portfolio/css/style.css
          hht/hands-on/summer-festival-annual-update/starter/css/style.css
          --config hht/tour/.stylelintrc.json

      - name: Check summer-festival links and fragments
        run: >-
          npx --yes linkinator
          hht/hands-on/summer-festival-annual-update/starter
          --recurse
          --check-fragments
