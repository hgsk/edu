name: Student Assignment

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  grade:
    name: Grade student submission
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted grader
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout pull request merge
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: student
          fetch-depth: 0
          persist-credentials: false

      - name: Collect changed files
        run: |
          merge_base="$(git -C student merge-base HEAD^1 HEAD^2)"
          git -C student diff --name-only "$merge_base" HEAD^2 > "$RUNNER_TEMP/changed-files.txt"

      - name: Classify PR using trusted author rules
        id: classify
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: >-
          python trusted/hht/scripts/classify_student_pr.py
          --author "$PR_AUTHOR"
          --head-repository "$PR_HEAD_REPOSITORY"
          --changed-files "$RUNNER_TEMP/changed-files.txt"
          --output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Grade assignment
        if: steps.classify.outputs.grade == 'true'
        run: >-
          python trusted/hht/scripts/grade_student_pr.py
          --base trusted
          --student student
          --changed-files "$RUNNER_TEMP/changed-files.txt"
          --summary "$GITHUB_STEP_SUMMARY"
