name: Workbook preview verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workbook-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.20.0'
      - name: Install preview tools
        run: |
          python -m pip install playwright==1.55.0
          npm install --prefix "$RUNNER_TEMP/workbook-preview" marked@15.0.12
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify navigation and capture actual preview
        env:
          NODE_PATH: ${{ runner.temp }}/workbook-preview/node_modules
        run: python .github/scripts/workbook-preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbook-preview-evidence
          path: hht/assets/workbook-split/
          if-no-files-found: error
