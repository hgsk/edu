<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="415" viewBox="0 0 1060 415"><rect width="100%" height="100%" fill="#f5f7f4"/><g font-family="Meiryo, sans-serif" fill="#193c32"><text x="28" y="42" font-size="25">DAY 5：余白には「内側」と「外側」がある</text><rect x="30" y="75" width="1000" height="255" rx="10" fill="#e6ece8" stroke="#8ba395" stroke-width="2"/><text x="48" y="107" font-size="20">外側の余白 margin</text><rect x="70" y="128" width="430" height="168" rx="10" fill="#d6e8f4" stroke="#2b677b" stroke-width="2"/><text x="90" y="158" font-size="19">border（枠）</text><text x="90" y="188" font-size="19">内側の余白 padding</text><rect x="115" y="205" width="340" height="60" rx="10" fill="#fff" stroke="#8ba395" stroke-width="2"/><text x="141" y="244" font-size="23">メニュー（文字）</text><rect x="635" y="128" width="350" height="168" rx="10" fill="#d6e8f4" stroke="#2b677b" stroke-width="2"/><rect x="670" y="205" width="280" height="60" rx="10" fill="#fff" stroke="#8ba395" stroke-width="2"/><text x="708" y="244" font-size="23">店舗案内</text><text x="520" y="195" font-size="20">← gap →</text><text x="520" y="225" font-size="18">項目の間</text><text x="30" y="378" font-size="21">paddingを増やす：押せる部分を広くする　／　gapを増やす：リンク同士を離す</text></g></svg>
