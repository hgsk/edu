<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300"><rect width="1100" height="300" fill="#f4f7f3"/><g font-family="Meiryo,sans-serif" fill="#1b493b"><text x="30" y="43" font-size="25">GitHubを使わず、ファイルと履歴を渡す</text><rect x="30" y="80" width="300" height="150" rx="12" fill="#dceee1"/><text x="55" y="119" font-size="23">本人のPC：ローカルGit</text><text x="55" y="159" font-size="20">編集 → 差分 → コミット</text><text x="55" y="199" font-size="20">HTML・CSS・画像・記録</text><text x="351" y="159" font-size="30">→</text><rect x="395" y="100" width="270" height="110" rx="12" fill="#fff" stroke="#568374"/><text x="420" y="143" font-size="23">s001-day01.bundle</text><text x="420" y="180" font-size="19">コミット済みの履歴を保存</text><text x="688" y="159" font-size="30">→</text><rect x="745" y="80" width="325" height="150" rx="12" fill="#dceee1"/><text x="767" y="119" font-size="23">別フォルダー・講師のPC</text><text x="767" y="159" font-size="20">検査 → clone → 表示確認</text><text x="767" y="199" font-size="20">開始・提出タグと差分を確認</text><text x="30" y="272" font-size="20">保存だけ・未追跡・未コミットの内容はbundleに入りません。</text></g></svg>
