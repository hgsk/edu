<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">毎回の共通手順の目的とゴール</title>
  <desc id="desc">目的は、続きから始められること、失敗しても戻せること、変更を講師へ伝えられること。制作ファイル・作業メモ・画像をGitへ記録し、bundleを作り、別フォルダーへ復元して中身を確認してから講師へ提出する。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#517666"/></marker>
    <style>
      text{font-family:'Yu Gothic','Meiryo',sans-serif;fill:#203a32}
      .bold{font-weight:700}
      .small{font-size:23px}
      .body{font-size:25px}
      .label{font-size:29px;font-weight:700}
      .icon{fill:none;stroke:#386c57;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .flow{fill:none;stroke:#517666;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="1000" rx="24" fill="#fffdf7"/>
  <text x="64" y="67" font-size="22" letter-spacing="2" fill="#517666">HTML・CSS講座 ／ 全15回共通</text>
  <text x="64" y="124" font-size="43" class="bold">記録して、確かめて、渡そう</text>

  <rect x="48" y="157" width="1344" height="306" rx="22" fill="#eaf3ec"/>
  <text x="76" y="207" font-size="32" class="bold">目的</text>
  <text x="164" y="206" class="body">自分が安心して作業し、講師にも変更を伝えるため</text>
  <rect x="76" y="232" width="408" height="204" rx="18" fill="#fff"/>
  <rect x="516" y="232" width="408" height="204" rx="18" fill="#fff"/>
  <rect x="956" y="232" width="408" height="204" rx="18" fill="#fff"/>

  <g class="icon" transform="translate(240 250)">
    <path d="M0 10h28l11 12h44v58H0z" fill="#eaf3ec"/>
    <path d="M20 48h42m-12-12 12 12-12 12"/>
  </g>
  <text x="280" y="369" text-anchor="middle" class="label">続きから始められる</text>
  <text x="280" y="406" text-anchor="middle" class="small">前回の作業を残しておく</text>
  <g class="icon" transform="translate(682 252)">
    <path d="M5 28a34 34 0 1 1-1 36"/>
    <path d="M5 8v23h24M40 27v24l16 10"/>
  </g>
  <text x="720" y="369" text-anchor="middle" class="label">失敗しても戻せる</text>
  <text x="720" y="406" text-anchor="middle" class="small">変更前の記録と比べられる</text>
  <g class="icon" transform="translate(1119 257)">
    <path d="M0 0h82v54H45L23 72V54H0z" fill="#eaf3ec"/>
    <path d="M17 18h48M17 35h31"/>
  </g>
  <text x="1160" y="369" text-anchor="middle" class="label">変更が講師に伝わる</text>
  <text x="1160" y="406" text-anchor="middle" class="small">何を直し、どう確かめたか残す</text>

  <text x="76" y="522" font-size="32" class="bold">ゴールまでの流れ</text>
  <text x="76" y="562" class="body">完成したファイル ＋ 作業メモ ＋ 必要な画像 を、履歴ごと渡す</text>

  <rect x="64" y="593" width="294" height="216" rx="18" fill="#eef4f7" stroke="#bdcfd6" stroke-width="2"/>
  <rect x="404" y="593" width="294" height="216" rx="18" fill="#eef4f7" stroke="#bdcfd6" stroke-width="2"/>
  <rect x="744" y="593" width="294" height="216" rx="18" fill="#fff2da" stroke="#e1c58d" stroke-width="2"/>
  <rect x="1084" y="593" width="294" height="216" rx="18" fill="#eaf3ec" stroke="#a4c5b0" stroke-width="2"/>
  <path d="M366 700h29" class="flow"/>
  <path d="M706 700h29" class="flow"/>
  <path d="M1046 700h29" class="flow"/>
  <g text-anchor="middle">
    <text x="211" y="642" class="small bold">1　記録する</text>
    <text x="211" y="697" class="label">Gitにコミット</text>
    <text x="211" y="748" class="small">ファイルとメモを</text>
    <text x="211" y="782" class="small">変更履歴に残す</text>
    <text x="551" y="642" class="small bold">2　まとめる</text>
    <text x="551" y="697" class="label">bundleを作る</text>
    <text x="551" y="748" class="small">ファイルと履歴が入った</text>
    <text x="551" y="782" class="small">提出用の1ファイル</text>
    <text x="891" y="642" class="small bold">3　確かめる</text>
    <text x="891" y="697" class="label">別フォルダーで復元</text>
    <text x="891" y="748" class="small">IDが同じか、中身が</text>
    <text x="891" y="782" class="small">そろって開けるか確認</text>
    <text x="1231" y="642" class="small bold">4　渡す</text>
    <text x="1231" y="697" class="label">講師へ提出</text>
    <text x="1231" y="748" class="small">確認したbundleを</text>
    <text x="1231" y="782" class="small">指定の提出先へ渡す</text>
  </g>
  <rect x="64" y="846" width="1314" height="97" rx="18" fill="#285641"/>
  <text x="720" y="906" text-anchor="middle" font-size="32" font-weight="700" style="fill:white">ゴール：復元して中身を確かめたbundleを提出できた！</text>
  <text x="720" y="976" text-anchor="middle" font-size="21">この図は目的と完成までの流れです。実際の操作は、この後のスクリーンショットで確認します。</text>
</svg>
