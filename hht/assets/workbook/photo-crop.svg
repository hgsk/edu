<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc"><title id="title">写真のどこが見えるか、幅を変えて確かめます</title><desc id="desc">図解・検討用の例です。実際の写真では、被写体と文字を画面で確認します。</desc><rect width="1080" height="310" rx="18" fill="#fff8ec"/><g font-family="Meiryo, sans-serif"><text x="32" y="46" font-size="25" font-weight="bold" fill="#214e43">写真のどこが見えるか、幅を変えて確かめます</text><text x="32" y="78" font-size="16" fill="#4e554e">図解・検討用の例です。実際の写真では、被写体と文字を画面で確認します。</text><rect x="32.0" y="105" width="325.3333333333333" height="170" rx="12" fill="white" stroke="#b6c9ba"/><text x="48.0" y="139" font-size="19" fill="#214e43" font-weight="bold">PCの横長画面</text><text x="48.0" y="175" font-size="16" fill="#343e39">左：見出しを置く余白</text><text x="48.0" y="204" font-size="16" fill="#343e39">右：カップを見せる</text><rect x="377.3333333333333" y="105" width="325.3333333333333" height="170" rx="12" fill="white" stroke="#b6c9ba"/><text x="393.3333333333333" y="139" font-size="19" fill="#214e43" font-weight="bold">スマホの縦長画面</text><text x="393.3333333333333" y="175" font-size="16" fill="#343e39">左右が切れることがあります</text><text x="393.3333333333333" y="204" font-size="16" fill="#343e39">カップが残る位置を探します</text><rect x="722.6666666666666" y="105" width="325.3333333333333" height="170" rx="12" fill="white" stroke="#b6c9ba"/><text x="738.6666666666666" y="139" font-size="19" fill="#214e43" font-weight="bold">文字も確かめます</text><text x="738.6666666666666" y="175" font-size="16" fill="#343e39">写真に重ねても読めるか</text><text x="738.6666666666666" y="204" font-size="16" fill="#343e39">必要なら配置を変えます</text></g></svg>