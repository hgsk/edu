<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc"><title id="title">紹介したい自分を、作品で伝えます</title><desc id="desc">図解・企画の例です。自分が実際に行った作業へ置き換えます。</desc><rect width="1080" height="310" rx="18" fill="#fff8ec"/><g font-family="Meiryo, sans-serif"><text x="32" y="46" font-size="25" font-weight="bold" fill="#214e43">紹介したい自分を、作品で伝えます</text><text x="32" y="78" font-size="16" fill="#4e554e">図解・企画の例です。自分が実際に行った作業へ置き換えます。</text><rect x="32.0" y="105" width="325.3333333333333" height="170" rx="12" fill="white" stroke="#b6c9ba"/><text x="48.0" y="139" font-size="19" fill="#214e43" font-weight="bold">だれに？</text><text x="48.0" y="175" font-size="16" fill="#343e39">インターン先の担当者</text><text x="48.0" y="204" font-size="16" fill="#343e39">見る人を一人決めます</text><rect x="377.3333333333333" y="105" width="325.3333333333333" height="170" rx="12" fill="white" stroke="#b6c9ba"/><text x="393.3333333333333" y="139" font-size="19" fill="#214e43" font-weight="bold">何を伝えたい？</text><text x="393.3333333333333" y="175" font-size="16" fill="#343e39">依頼の範囲を確認して</text><text x="393.3333333333333" y="204" font-size="16" fill="#343e39">制作できること</text><rect x="722.6666666666666" y="105" width="325.3333333333333" height="170" rx="12" fill="white" stroke="#b6c9ba"/><text x="738.6666666666666" y="139" font-size="19" fill="#214e43" font-weight="bold">何を見せる？</text><text x="738.6666666666666" y="175" font-size="16" fill="#343e39">共通ボタンを直した作品</text><text x="738.6666666666666" y="204" font-size="16" fill="#343e39">3ページを確認した記録</text></g></svg>