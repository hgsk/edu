<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc"><title id="title">同じ「ラテ」でも、今回直すのはどれでしょうか</title><desc id="desc">図解・依頼対象の例です。商品名と単品・セットを照合します。</desc><rect width="1080" height="310" rx="18" fill="#fff8ec"/><g font-family="Meiryo, sans-serif"><text x="32" y="46" font-size="25" font-weight="bold" fill="#214e43">同じ「ラテ」でも、今回直すのはどれでしょうか</text><text x="32" y="78" font-size="16" fill="#4e554e">図解・依頼対象の例です。商品名と単品・セットを照合します。</text><rect x="32.0" y="105" width="325.3333333333333" height="170" rx="12" fill="white" stroke="#b6c9ba"/><text x="48.0" y="139" font-size="19" fill="#214e43" font-weight="bold">アイスカフェラテ単品</text><text x="48.0" y="175" font-size="16" fill="#343e39">変更します</text><text x="48.0" y="204" font-size="16" fill="#343e39">520円 → 550円</text><rect x="377.3333333333333" y="105" width="325.3333333333333" height="170" rx="12" fill="white" stroke="#b6c9ba"/><text x="393.3333333333333" y="139" font-size="19" fill="#214e43" font-weight="bold">ホットカフェラテ</text><text x="393.3333333333333" y="175" font-size="16" fill="#343e39">そのまま残します</text><text x="393.3333333333333" y="204" font-size="16" fill="#343e39">520円</text><rect x="722.6666666666666" y="105" width="325.3333333333333" height="170" rx="12" fill="white" stroke="#b6c9ba"/><text x="738.6666666666666" y="139" font-size="19" fill="#214e43" font-weight="bold">ラテ＆スコーンセット</text><text x="738.6666666666666" y="175" font-size="16" fill="#343e39">そのまま残します</text><text x="738.6666666666666" y="204" font-size="16" fill="#343e39">850円</text></g></svg>