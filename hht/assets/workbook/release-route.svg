<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc"><title id="title">公開してからも、確認が続きます</title><desc id="desc">図解・練習用公開先での作業です。採用案の明示承認を待ちます。</desc><rect width="1080" height="310" rx="18" fill="#fff8ec"/><g font-family="Meiryo, sans-serif"><text x="32" y="46" font-size="25" font-weight="bold" fill="#214e43">公開してからも、確認が続きます</text><text x="32" y="78" font-size="16" fill="#4e554e">図解・練習用公開先での作業です。採用案の明示承認を待ちます。</text><rect x="32.0" y="105" width="325.3333333333333" height="170" rx="12" fill="white" stroke="#b6c9ba"/><text x="48.0" y="139" font-size="19" fill="#214e43" font-weight="bold">1　確認してもらいます</text><text x="48.0" y="175" font-size="16" fill="#343e39">2案とおすすめを提出</text><text x="48.0" y="204" font-size="16" fill="#343e39">採用案の明示承認を受領</text><rect x="377.3333333333333" y="105" width="325.3333333333333" height="170" rx="12" fill="white" stroke="#b6c9ba"/><text x="393.3333333333333" y="139" font-size="19" fill="#214e43" font-weight="bold">2　戻せる状態にします</text><text x="393.3333333333333" y="175" font-size="16" fill="#343e39">対象ファイルを照合</text><text x="393.3333333333333" y="204" font-size="16" fill="#343e39">公開前の版を保存</text><rect x="722.6666666666666" y="105" width="325.3333333333333" height="170" rx="12" fill="white" stroke="#b6c9ba"/><text x="738.6666666666666" y="139" font-size="19" fill="#214e43" font-weight="bold">3　公開先で確かめます</text><text x="738.6666666666666" y="175" font-size="16" fill="#343e39">承認済みファイルを反映</text><text x="738.6666666666666" y="204" font-size="16" fill="#343e39">URLで表示・リンクを確認</text></g></svg>