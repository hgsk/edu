<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>教育専用HTML比較</title></head>
<body>
  <main>
    <h1>教育専用HTML比較</h1>
    <p>固定された無害な見出しだけを比較します。通常アプリ・提出正解へコピーしません。</p>
    {% if enabled %}
    <p><a href="{{ url_for('compare', message=demo_text) }}">同じ入力を安全・危険の2通りで比べる</a></p>
    {% else %}
    <p>比較モードは無効です。</p>
    {% endif %}
  </main>
</body>
</html>
