<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写真の配置を比べる参考例</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #fffdf7; color: #203b33; font: 18px/1.6 system-ui, sans-serif; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { margin: 0 0 30px; }
  .examples { display: flex; gap: 46px; align-items: flex-start; }
  h2 { font-size: 20px; }
  .wide { position: relative; width: 630px; height: 320px; }
  img { width: 100%; height: 100%; object-fit: cover; }
  .cup-target { position: absolute; left: 57%; top: 53%; width: 21%; height: 30%; }
  .sample-heading { position: absolute; left: 22px; top: 50px; width: 270px; color: white; font-size: 30px; font-weight: 700; text-shadow: 0 2px 5px black; }
  .phone { width: 250px; height: 360px; border: 5px solid #203b33; border-radius: 16px; overflow: hidden; }
  .phone img { object-position: 70% center; }
  .note { font-size: 16px; margin-top: 36px; }
</style>
<h1>写真の配置を比べる参考例</h1>
<p>教材の写真で切り取り方と文字の位置を試す図です。カフェサイトへ反映済みの画面ではありません。</p>
<div class="examples">
  <section><h2>横長の表示</h2><div class="wide">
    <img src="../starter-site/images/hero-cafe.webp" alt="カップにミルクを注ぐ場面">
    <div class="cup-target" aria-label="残したいカップの位置"></div>
    <div class="sample-heading">カフェの一杯</div>
  </div></section>
  <section><h2>縦長の表示</h2><div class="phone">
    <img src="../starter-site/images/hero-cafe.webp" alt="カップが残るように表示位置を調整した縦長の表示">
  </div></section>
</div>
<p class="note">同じ写真を表示しています。縦長の例は object-position: 70% center でカップの位置を調整しています。</p>
</html>
