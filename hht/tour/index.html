<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>わたしのWebデザイン練習帳</title>
    <meta name="description" content="HTMLとCSSを練習するための自己紹介ページです。">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <p class="logo">MY DESIGN NOTE</p>
      <nav aria-label="ページ内メニュー">
        <a href="#about">わたしについて</a>
        <a href="#favorite">好きなもの</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>自己紹介ページ</h1>
        <p>HTMLで自己紹介を書き、CSSで文字や色、配置を変更する練習です。</p>
        <a class="button" href="#about">自己紹介を見る</a>
      </section>

      <section id="about" class="section">
        <h2>わたしについて</h2>
        <p>ここを、自分の名前や学んでいることに書きかえてみよう。</p>
      </section>

      <section id="favorite" class="section section--accent">
        <h2>好きなもの</h2>
        <ul class="card-list">
          <li class="card">好きな色</li>
          <li class="card">好きな食べ物</li>
          <li class="card">好きな場所</li>
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <p><small>&copy; 2026 MY DESIGN NOTE</small></p>
    </footer>
  </body>
</html>
